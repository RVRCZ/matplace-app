# matplace farm-agent — copy to config.yaml and fill in.
# The file holds a secret (token): chmod 600 config.yaml

server: https://beta.matplace.com        # matplace address, https only
token: mpa_PASTE_THE_TOKEN_FROM_ADMIN    # /admin/farm/agents -> "Vytvořit a zobrazit token" (or env FARM_AGENT_TOKEN)

poll_seconds: 5          # how often the agent asks matplace for work and reports printer states
snapshot_seconds: 15     # camera picture of a running print, every N seconds (live view; the server keeps one a minute for the time-lapse)
work_dir: ./work         # downloaded G-code and the state that survives a restart
log_level: INFO          # DEBUG shows every request

printers:
  # "key" must equal the printer's key in /admin/farm/printers, and the printer must be assigned to this agent there.
  - key: kobra-s1-01
    driver: moonraker
    url: http://192.168.8.21:7125                          # Moonraker on the printer (Rinkhals), reserve this IP in the router
    snapshot_url: http://192.168.8.21/webcam/?action=snapshot
    # light_device: chamber_light                          # switched on for the camera during a print (Rinkhals default); "" = no light
    # api_key: ...                                          # only when Moonraker is set up to require one

  # Second, third… printer: one more block. One agent serves them all.
  # - key: kobra-s1-02
  #   driver: moonraker
  #   url: http://192.168.8.22:7125
  #   snapshot_url: http://192.168.8.22/webcam/?action=snapshot

  # Kobra X (stock Anycubic firmware): the printer must be in LAN mode - it then leaves the Anycubic cloud (README).
  # - key: kobra-x-01
  #   driver: anycubic_lan
  #   ip: 192.168.8.44                                     # reserve this IP in the router
  #   # camera: true                                       # picture from the printer's own camera (needs the package av)
  #   # light: true                                        # the camera light on during a print, off after it
  #   # park_lead_min: 2.2                                 # the head reaches the park 2.2-4.0 s AFTER the printer reports the layer (measured);
  #   # park_lead: 4.0                                     #   with the printer's dwell >= 2.3 s the agent takes one picture in the sure window
  #   # park_window_min: 0.5                               # a sure window shorter than this is not used (the agent looks every 0.25 s)
  #   # layer_window: 0                                    # by hand: seconds the park is a planned position after a reported layer (0 = measured timing)
  #   # auto_leveling: true                                # the printer levels the bed before every print (as after the Slicer Next)
  #   # package: true                                      # the file goes up as a .gcode.3mf package with a thumbnail; false = bare G-code (README)

  # Simulated printer — try the whole order flow without a machine (see README, "Zkouška bez tiskárny").
  # - key: kobra-s1-01
  #   driver: mock
  #   print_seconds: 90        # length of a simulated print
  #   # fail_at: 40            # let the print fail at 40 % to see the refund and the alert
