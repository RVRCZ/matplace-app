# /etc/nginx/sites-available/matplace-app
# beta.matplace.com during development; later matplace.com (the legacy app moves to legacy.matplace.com).
server {
    listen 80;
    server_name beta.matplace.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name beta.matplace.com;

    root /var/www/matplace-app/public;
    index index.php;

    client_max_body_size 120M;      # uploads.max_mb + headroom
    client_body_timeout 120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml model/stl;
    gzip_min_length 1000;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }

    ssl_certificate /etc/letsencrypt/live/beta.matplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.matplace.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
