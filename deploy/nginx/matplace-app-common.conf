# /etc/nginx/snippets/matplace-app-common.conf
# The application itself: included by the server blocks of matplace.com and beta.matplace.com (each has its own certificate).
    root /var/www/matplace-app/public;
    index index.php;

    client_max_body_size 520M;      # a designer's zip of models may have 500 MB (docs/B.md); php.ini must allow it too
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml model/stl;
    gzip_min_length 1000;

    add_header Strict-Transport-Security "max-age=31536000" always;   # not includeSubDomains: wms and legacy are other sites
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # the built assets carry a hash in their name: cache them for good
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files. A picture that is not a file is drawn by the application (/og/…/….png, previews of
    # models), so it must fall through to index.php, not end as a 404 here.
    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known) { deny all; }
