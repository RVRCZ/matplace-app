# /etc/nginx/sites-available/matplace.com
#
# The new application on the main domain. PREPARED, NOT DEPLOYED: Roman switches the domains by hand.
#
# Before enabling:
#   1. certificates: certbot --nginx -d matplace.com -d www.matplace.com -d beta.matplace.com -d matplace.cz -d www.matplace.cz
#      (or certbot certonly and keep the paths below)
#   2. the old site must already answer on legacy.matplace.com (deploy/nginx/legacy.matplace.com.conf)
#   3. in /var/www/matplace-app/.env: APP_URL=https://matplace.com, remove MAIL_ALWAYS_TO, LEGACY_HOST=https://legacy.matplace.com,
#      LEGACY_ASSETS_URL=https://legacy.matplace.com; Google and Facebook sign-in: add https://matplace.com/auth/{google,facebook}/callback
#      as redirect URIs; Stripe webhook: https://matplace.com/webhooks/payments/stripe; YouTube callback URI
#   4. php artisan optimize && systemctl restart php8.2-fpm && php artisan matplace:sitemap
#   5. disable the old vhosts of matplace.com and of beta.matplace.com (sites-enabled/matplace, sites-enabled/matplace-app)
#   6. nginx -t && systemctl reload nginx
#
# Old addresses are answered by the application itself (config/legacy.php): pages that moved get a 301 to their new
# address, accounts and orders of the old site a 302 to legacy.matplace.com. Nothing of that is repeated here.

# http → https, every name
server {
    listen 80;
    listen [::]:80;
    server_name matplace.com www.matplace.com beta.matplace.com matplace.cz www.matplace.cz;
    return 301 https://matplace.com$request_uri;
}

# the Czech domain and www → the one address the site lives at
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.matplace.com matplace.cz www.matplace.cz;

    ssl_certificate /etc/letsencrypt/live/matplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matplace.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://matplace.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # beta keeps answering (bookmarks, the print agents' API address) with the same application
    server_name matplace.com beta.matplace.com;

    root /var/www/matplace-app/public;
    index index.php;

    client_max_body_size 520M;      # a designer's zip of models may have 500 MB (docs/B.md); php.ini must allow it too
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml model/stl;
    gzip_min_length 1000;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # the built assets carry a hash in their name: cache them for good
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files. A picture that is not a file is drawn by the application (/og/…/….png, previews of
    # models), so it must fall through to index.php, not end as a 404 here.
    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known) { deny all; }

    ssl_certificate /etc/letsencrypt/live/matplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matplace.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
