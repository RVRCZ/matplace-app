# /etc/nginx/sites-available/matplace.com
#
# The new application on the main domain. LIVE since 3 Oct 2026 (the switch is described in docs/DEPLOY-BETA.md).
#
# Before enabling:
#   1. certificates: matplace.com (+www), matplace.cz (+www) and beta.matplace.com already exist on the server;
#      legacy.matplace.com: certbot certonly --nginx -d legacy.matplace.com (after its DNS record exists)
#      copy deploy/nginx/matplace-app-common.conf to /etc/nginx/snippets/
#   2. the old site must already answer on legacy.matplace.com (deploy/nginx/legacy.matplace.com.conf)
#   3. in /var/www/matplace-app/.env: APP_URL=https://matplace.com, remove MAIL_ALWAYS_TO, LEGACY_HOST=https://legacy.matplace.com,
#      LEGACY_ASSETS_URL=https://legacy.matplace.com; Google and Facebook sign-in: add https://matplace.com/auth/{google,facebook}/callback
#      as redirect URIs; Stripe webhook: https://matplace.com/webhooks/payments/stripe; YouTube callback URI
#   4. php artisan optimize && systemctl restart php8.2-fpm && php artisan matplace:sitemap
#   5. disable the old vhosts of matplace.com and of beta.matplace.com (sites-enabled/matplace, sites-enabled/matplace-app)
#   6. nginx -t && systemctl reload nginx
#
# Old addresses are answered by the application itself (config/legacy.php): pages that moved get a 301 to their new
# address, accounts and orders of the old site a 302 to legacy.matplace.com. Nothing of that is repeated here.

# http → https, every name
server {
    listen 80;
    listen [::]:80;
    server_name matplace.com www.matplace.com matplace.cz www.matplace.cz;
    return 301 https://matplace.com$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name beta.matplace.com;
    return 301 https://beta.matplace.com$request_uri;
}

# the Czech domain and www → the one address the site lives at
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.matplace.com;

    ssl_certificate /etc/letsencrypt/live/matplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matplace.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://matplace.com$request_uri;
}

# the Czech domain has its own certificate
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matplace.cz www.matplace.cz;

    ssl_certificate /etc/letsencrypt/live/matplace.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matplace.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://matplace.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matplace.com;

    include snippets/matplace-app-common.conf;

    ssl_certificate /etc/letsencrypt/live/matplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matplace.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# beta keeps answering with the same application (bookmarks, the print agents' API address), under its own certificate
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta.matplace.com;

    include snippets/matplace-app-common.conf;

    ssl_certificate /etc/letsencrypt/live/beta.matplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.matplace.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
