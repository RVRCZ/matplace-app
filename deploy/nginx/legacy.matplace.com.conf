# /etc/nginx/sites-available/legacy.matplace.com
#
# The old site (own PHP MVC in /var/www/matplace) moved aside to legacy.matplace.com, where its existing customers,
# printers and running orders keep working. PREPARED, NOT DEPLOYED: Roman switches the domains by hand.
#
# This file is written from what the application knows about the old site (document root public/, one front
# controller index.php). Compare it with the vhost matplace.com runs on today (/etc/nginx/sites-available/matplace)
# and carry over anything specific to it: the PHP-FPM socket and version, upload limits, extra locations.
#
# Before enabling:
#   1. DNS: legacy.matplace.com → this server; certbot --nginx -d legacy.matplace.com
#   2. in /var/www/matplace/.env set the site's own address to https://legacy.matplace.com (links in its e-mails,
#      payment return addresses, OAuth redirect URIs of the old Google/Facebook apps)
#   3. nginx -t && systemctl reload nginx
#
# The old site is kept out of search engines: its catalogue and blog live on matplace.com now, with the same
# addresses, and two copies of one page would compete.

server {
    listen 80;
    listen [::]:80;
    server_name legacy.matplace.com;
    return 301 https://legacy.matplace.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name legacy.matplace.com;

    root /var/www/matplace/public;
    index index.php;

    client_max_body_size 120M;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # pages that now live on the new site with the same address: send people (and Google) there for good
    location ~ ^/(model|blog)(/|$) {
        return 301 https://matplace.com$request_uri;
    }
    location = /katalog {
        return 301 https://matplace.com/model;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # check: the version the old site runs on today
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 30d;
        # /blog-img/…, /thumbnails/… are served by index.php when they are not files
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known) { deny all; }

    ssl_certificate /etc/letsencrypt/live/legacy.matplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legacy.matplace.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
